version: '3.8'

# ─────────────────────────────────────────────────────────────
# Production overrides — tuned for 2 GB RAM + 8 GB swap
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── Django Backend ────────────────────────────────────────
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
    ports: []
    mem_limit: 400m
    memswap_limit: 1g
    restart: always

  # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    mem_limit: 256m
    memswap_limit: 512m
    restart: always

  # ── Celery Beat ───────────────────────────────────────────
  celery_beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    mem_limit: 128m
    memswap_limit: 256m
    restart: always

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c effective_cache_size=256MB
    mem_limit: 512m
    memswap_limit: 1g
    restart: always

  # ── Redis ─────────────────────────────────────────────────
  redis:
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    memswap_limit: 256m
    restart: always

  # ── GeoServer (reduced heap for 2GB server) ───────────────
  geoserver:
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dgeoserver.csrf.disabled=true
        -DGEOSERVER_DATA_DIR=/opt/geoserver_data
    ports: []
    mem_limit: 700m
    memswap_limit: 2g
    restart: always

  # ── Frontend (multi-stage build) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws
        VITE_GEOSERVER_URL: /geoserver
    ports: []
    volumes:
      - frontend_dist:/dist
    restart: "no"
    command: ["sh", "-c", "cp -r /dist-src/. /dist/ && echo 'Build complete.'"]

  # ── Nginx (SSL) ───────────────────────────────────────────
  nginx:
    volumes:
      - backend_static:/staticfiles:ro
      - backend_media:/media:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 64m
    memswap_limit: 128m
    restart: always

  # ── Superset DISABLED on 2GB droplet (needs 1GB+) ────────
  # To enable: uncomment and resize to 4GB droplet
  superset:
    profiles: ["superset"]   # won't start unless --profile superset is passed

volumes:
  frontend_dist:

