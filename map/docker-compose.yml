services:
  mining_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mining_backend
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_DB: mining_db
      POSTGRES_USER: mining_user
      POSTGRES_PASSWORD: mining_password
      POSTGRES_HOST: mining_postgis
      POSTGRES_PORT: 5432
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - mining_network
    depends_on:
      - mining_postgis
    restart: unless-stopped

  mining_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mining_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_GEOSERVER_URL: http://localhost:8082/geoserver
      VITE_GEOSERVER_WORKSPACE: Mining_WS
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - mining_network
    depends_on:
      - mining_backend
    restart: unless-stopped

  mining_postgis:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: mining_postgis
    environment:
      POSTGRES_DB: mining_db
      POSTGRES_USER: mining_user
      POSTGRES_PASSWORD: mining_password
    ports:
      - "5434:5432"
    volumes:
      - mining_postgis_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - mining_network
    restart: unless-stopped

  mining_geoserver:
    image: kartoza/geoserver:2.28.0
    container_name: mining_geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: admin123
    ports:
      - "8082:8080"
    volumes:
      - mining_geoserver_data:/opt/geoserver/data_dir
    networks:
      - mining_network
    restart: unless-stopped
    depends_on:
      - mining_postgis
  

networks:
  mining_network:
    name: mining_network
    driver: bridge

volumes:
  mining_postgis_data:
    name: mining_postgis_data

  mining_geoserver_data:
    name: mining_geoserver_data

  frontend_node_modules:
    name: frontend_node_modules